<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    /* ✅ wider left column + slightly wider right */
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr 260px;
      gap: 20px;
      max-width: 1400px;
      margin: auto;
      padding: 20px;
    }

    .left {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      border-right: 1px solid #ddd;
      padding-right: 10px;
      line-height: 1.35; /* tighter schedule spacing */
    }

    .center {
      min-width: 0;
    }

    .right {
      position: sticky;
      top: 80px;
      border-left: 1px solid #ddd;
      padding-left: 10px;
      font-size: 0.9em;
    }

    /* TOC styling */
    .page-toc ul {
      list-style-type: none;
      padding-left: 0;
      margin-top: 0;
    }

    .page-toc li {
      margin-bottom: 6px;
    }

    .page-toc a {
      text-decoration: none;
      color: #444;
    }

    .page-toc a:hover {
      text-decoration: underline;
    }

    .page-toc h2 {
      font-size: 1em;
      margin-top: 0;
    }

    /* mobile */
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .left, .right {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="layout">

    <!-- LEFT: Schedule -->
    <aside class="left">
      {% assign schedule = site.pages | where: "name", "Schedule.md" | first %}
      {% if schedule %}
        {{ schedule.content | markdownify }}
      {% else %}
        <p>Schedule not found</p>
      {% endif %}
    </aside>

    <!-- ✅ Split content into main + TOC -->
    {% assign parts = content | split:'<div class="page-toc">' %}

    <!-- CENTER: Main content -->
    <main class="center">
      {{ parts[0] }}
    </main>

    <!-- RIGHT: TOC -->
    <aside class="right">
      {% if parts.size > 1 %}
        <div class="page-toc">
          {{ parts[1] | split:'</div>' | first }}
        </div>
      {% endif %}
    </aside>

  </div>

</body>
</html>
