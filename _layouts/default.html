---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root {
      --page-bg: #f3f7f2;
      --panel-bg: #fbfdf9;
      --panel-alt: #edf4ee;
      --text: #1b221d;
      --muted: #5a665f;
      --border: #cad7cd;
      --accent: #1f5c45;
      --accent-hover: #174534;
      --accent-soft: #ddebe3;
      --shadow: 0 10px 30px rgba(31, 35, 40, 0.08);
      --max-width: 1400px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(31, 92, 69, 0.08), transparent 28%),
        linear-gradient(180deg, #fbfefb 0%, var(--page-bg) 100%);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.65;
    }

    a {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.16em;
    }

    a:hover {
      color: var(--accent-hover);
      text-decoration-thickness: 2px;
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(31, 92, 69, 0.28);
      outline-offset: 2px;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .skip-link {
      position: absolute;
      left: 1rem;
      top: 1rem;
      z-index: 1001;
      padding: 0.75rem 1rem;
      background: var(--panel-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      transform: translateY(-200%);
      transition: transform 0.2s ease;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 1rem 1.25rem;
      background: rgba(255, 253, 248, 0.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      min-width: 0;
    }

    .nav-left img {
      display: block;
      width: 3.25rem;
      height: 3.25rem;
      object-fit: contain;
    }

    .site-title {
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .menu-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 2.75rem;
      height: 2.75rem;
      border: 1px solid var(--border);
      border-radius: 0.8rem;
      background: var(--panel-bg);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.45rem 0.65rem;
      border-radius: 0.65rem;
    }

    .nav-links a.active,
    .nav-links a[aria-current="page"] {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .search-box {
      position: relative;
      min-width: 12rem;
    }

    .search-box input {
      width: 100%;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 0.7rem;
      background: var(--panel-bg);
      color: var(--text);
      font: inherit;
    }

    #results-container {
      position: absolute;
      top: calc(100% + 0.4rem);
      left: 0;
      width: 100%;
      margin: 0;
      padding: 0.5rem;
      list-style: none;
      display: none;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 0.85rem;
      box-shadow: var(--shadow);
      z-index: 1000;
      max-height: 18rem;
      overflow-y: auto;
    }

    #results-container li {
      padding: 0.25rem 0.25rem;
    }

    #results-container a {
      text-decoration: underline;
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.14em;
      color: var(--accent);
    }

    #results-container a:hover {
      color: var(--accent-hover);
    }

    .layout {
      display: grid;
      grid-template-columns: 18rem minmax(0, 1fr) 18rem;
      gap: 1.5rem;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 1.5rem;
      align-items: start;
    }

    .left,
    .right,
    main {
      min-width: 0;
    }

    .left,
    .right {
      position: sticky;
      top: 1.5rem;
      max-height: calc(100vh - 3rem);
      overflow-y: auto;
      padding: 1rem;
      background: rgba(255, 253, 248, 0.88);
      border: 1px solid var(--border);
      border-radius: 1rem;
      box-shadow: var(--shadow);
    }

    .left nav,
    .right nav {
      display: block;
    }

    .left h2,
    .right h2 {
      margin: 0 0 0.75rem;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 1rem;
    }

    .left ul {
      margin: 0;
      padding-left: 1.1rem;
    }

    .left li {
      margin: 0.35rem 0;
    }

    .left a {
      color: var(--accent);
      text-decoration: underline;
    }

    .left a.active,
    .left a[aria-current="page"] {
      color: var(--accent-hover);
      font-weight: 700;
      background: var(--accent-soft);
      padding: 0.1rem 0.3rem;
      border-radius: 0.35rem;
    }

    .left a:hover {
      color: var(--accent-hover);
    }

    main {
      padding: 1.25rem;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      box-shadow: var(--shadow);
    }

    .page-nav {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 0.75rem;
      align-items: center;
      margin: 0 0 1.25rem;
      padding: 0.85rem 1rem;
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 0.85rem;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 0.95rem;
    }

    .page-nav > div:nth-child(2) {
      text-align: center;
      font-weight: 700;
    }

    .page-nav > div:last-child {
      text-align: right;
    }

    .page-nav a {
      color: var(--text);
      text-decoration: none;
    }

    .page-nav a:hover {
      text-decoration: underline;
    }

    .right :is(ul, ol) {
      padding-left: 1.1rem;
    }

    .site-footer {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 1.5rem 1.5rem;
    }

    .footer-content {
      padding: 1rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: rgba(255, 253, 248, 0.88);
      color: var(--muted);
      text-align: center;
      box-shadow: var(--shadow);
    }

    @media (max-width: 900px) {
      .top-nav {
        flex-wrap: wrap;
        align-items: flex-start;
      }

      .nav-right {
        width: 100%;
        justify-content: flex-end;
      }

      .menu-toggle {
        display: inline-flex;
      }

      .nav-links {
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
        padding: 0.75rem;
        background: var(--panel-bg);
        border: 1px solid var(--border);
        border-radius: 0.9rem;
        box-shadow: var(--shadow);
      }

      .nav-links.open {
        display: flex;
      }

      .nav-links a {
        width: 100%;
      }

      .search-box {
        min-width: 0;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .left,
      .right {
        position: static;
        max-height: none;
      }

      .page-nav {
        grid-template-columns: 1fr;
        text-align: left;
      }

      .page-nav > div:nth-child(2),
      .page-nav > div:last-child {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="top-nav">
    <div class="nav-left">
      <a href="{{ '/' | relative_url }}" aria-label="Go to the schedule home page">
        <img src="{{ '/assets/img/Capstone_Logo.png' | relative_url }}" alt="CMSE 495 logo">
      </a>
      <div class="site-title">CMSE495 Data Science Capstone</div>
    </div>

    <div class="nav-right">
      <button class="menu-toggle" type="button" aria-controls="nav-links" aria-expanded="false" onclick="toggleMenu(this)">☰</button>

      <nav id="nav-links" class="nav-links" aria-label="Primary">
        <a href="{{ '/' | relative_url }}" {% if page.layout == "schedule" %}class="active" aria-current="page"{% endif %}>Schedule</a>
        <a href="{{ '/Guide/' | relative_url }}" {% if page.layout == "guide" %}class="active" aria-current="page"{% endif %}>Course Guide</a>
        <a href="{{ '/Seeking-Community_Partners' | relative_url }}">Community Partners</a>

        <div class="search-box">
          <label class="sr-only" for="search-input">Search site</label>
          <input type="text" id="search-input" placeholder="Search site..." autocomplete="off">
          <ul id="results-container" aria-live="polite"></ul>
        </div>
      </nav>
    </div>
  </header>

  {{ content }}

  <footer class="site-footer">
    <div class="footer-content">
      {{ site.description }}
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/simple-jekyll-search@latest/dest/simple-jekyll-search.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const input = document.getElementById("search-input");
      const results = document.getElementById("results-container");

      if (input && results && typeof SimpleJekyllSearch !== "undefined") {
        SimpleJekyllSearch({
          searchInput: input,
          resultsContainer: results,
          json: "{{ '/search.json' | relative_url }}",
          searchResultTemplate: '<li><a href="{url}">{title}</a></li>',
          noResultsText: '<li>No results found</li>',
          limit: 10
        });

        input.addEventListener("input", function () {
          results.style.display = this.value.length > 0 ? "block" : "none";
        });
      }
    });

    function toggleMenu(button) {
      const nav = document.getElementById("nav-links");
      const expanded = nav.classList.toggle("open");
      button.setAttribute("aria-expanded", expanded ? "true" : "false");
    }
  </script>
</body>
</html>
