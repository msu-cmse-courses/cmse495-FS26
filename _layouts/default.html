<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { margin: 0; font-family: Arial, sans-serif; line-height: 1.6; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; border-bottom: 1px solid #ddd; max-width: 1400px; margin: auto; }
    .nav-left { display: flex; align-items: center; gap: 15px; }
    .nav-left img { height: 50px; }
    .nav-right { display: flex; align-items: center; position: relative; }
    .nav-right a { margin-left: 18px; text-decoration: none; color: #444; font-weight: 500; }
    .layout { display: grid; grid-template-columns: 320px 1fr 260px; gap: 20px; max-width: 1400px; margin: auto; padding: 20px; }
    .left, .right { position: sticky; top: 20px; height: calc(100vh - 40px); overflow-y: auto; }
    .left { border-right: 1px solid #ddd; padding-right: 10px; }
    .right { border-left: 1px solid #ddd; padding-left: 10px; }
    .menu-toggle { display: none; }
    .nav-links { display: flex; gap: 15px; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .right { display: none; }
      .menu-toggle { display: block; }
      .nav-links { display: none; flex-direction: column; position: absolute; right: 20px; top: 60px; background: white; border: 1px solid #ddd; padding: 10px; width: 220px; }
      .nav-links.open { display: flex; }
      .left { display: none; }
    }
  </style>
</head>
<body>

<div class="top-nav">
  <div class="nav-left">
    <a href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/Capstone_Logo.png' | relative_url }}">
    </a>
    <strong>CMSE495 Data Science Capstone</strong>
  </div>

  <div class="nav-right">
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>

    <div id="nav-links" class="nav-links">
      <a href="{{ '/' | relative_url }}">Schedule</a>
      <a href="{{ '/Guide/' | relative_url }}">Course Guide</a>
      <a href="{{ '/Seeking-Community_Partners' | relative_url }}">Community Partners</a>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="left">LEFT SIDEBAR</aside>
  <main>{{ content }}</main>
  <aside class="right">RIGHT SIDEBAR</aside>
</div>

<script>
function toggleMenu() {
  const nav = document.getElementById("nav-links");
  nav.classList.toggle("open");
}
</script>

</body>
</html>
