<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr 220px;
      gap: 20px;
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .left {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      border-right: 1px solid #ddd;
      padding-right: 10px;
    }

    .center {
      min-width: 0;
    }

    .right {
      /* just spacing column now */
    }

    /* ✅ THIS is the key fix */
    .page-toc {
      float: right;
      width: 220px;
      margin-left: 20px;
      margin-bottom: 10px;

      font-size: 0.9em;
      border-left: 1px solid #ddd;
      padding-left: 10px;
    }

    .page-toc ul {
      list-style-type: none;
      padding-left: 0;
      margin-top: 0;
    }

    .page-toc li {
      margin-bottom: 6px;
    }

    .page-toc a {
      text-decoration: none;
      color: #444;
    }

    .page-toc a:hover {
      text-decoration: underline;
    }

    .page-toc h2 {
      font-size: 1em;
      margin-top: 0;
    }

    /* mobile */
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .left, .right {
        display: none;
      }

      .page-toc {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="layout">

    <!-- LEFT: Schedule -->
    <aside class="left">
      {% assign schedule = site.pages | where: "name", "Schedule.md" | first %}
      {% if schedule %}
        {{ schedule.content | markdownify }}
      {% else %}
        <p>Schedule not found</p>
      {% endif %}
    </aside>

    <!-- CENTER: Content (with floating TOC) -->
    <main class="center">
      {{ content }}
    </main>

    <!-- RIGHT: empty spacer -->
    <aside class="right"></aside>

  </div>

</body>
</html>
